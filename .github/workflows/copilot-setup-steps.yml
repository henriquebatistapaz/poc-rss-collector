name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml, .ai-init/agent-setup.sh]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml, .ai-init/agent-setup.sh]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "27"
          cache: maven
      - name: Agent environment
        run: bash .ai-init/agent-setup.sh
